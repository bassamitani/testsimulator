:root{
  --bg:#f7f2e8; --card:#fdfbf6; --ink:#1c2333; --muted:#5b6475; --teal:#0f6b63; --teal-d:#0b4f4a;
  --teal-l:#d5e6e3; --opt:#f4efe5; --line:#e6dfcf; --red:#c8532b; --amber:#d28a1c; --amber-l:#fbf0d9;
  --t0:#7a9bb5; --t1:#0f6b63; --t2:#b8741a; --t3:#3b3f6b;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-variant-ligatures:none;margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(1200px 500px at 50% -10%,#fffaf0 0,transparent 70%);min-height:100vh;line-height:1.45}
button{font-family:inherit}
:focus-visible{outline:3px solid #6bb5ab;outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;max-width:860px;margin:0 auto;padding:18px 20px 6px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:-.01em}
.logo b{color:var(--teal);font-weight:700}
.alpha{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--red);background:#f8e1d7;border-radius:99px;padding:4px 9px;margin-left:4px}
.who{font-size:14px;color:var(--muted);display:flex;gap:14px;align-items:center}
.who a{color:var(--teal);font-weight:700;text-decoration:underline;cursor:pointer}

.wrap{max-width:820px;margin:0 auto;padding:10px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 32px;
  box-shadow:0 22px 44px -26px rgba(70,45,10,.45),0 2px 0 rgba(255,255,255,.8) inset;animation:in .25s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.center{text-align:center}
.h1{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:-.02em;margin:6px 0 10px}
.h-big{font-family:var(--serif);font-weight:700;font-size:44px;letter-spacing:-.02em;margin:14px 0 8px}
.lead{color:#3d4658;font-size:16.5px;max-width:62ch;margin:0 0 18px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:#3d4658;margin:22px 0 10px}
.chip-s{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;background:var(--teal-l);color:var(--teal-d);padding:7px 14px;border-radius:99px}
.mono{font-family:var(--mono)} .b{font-weight:700} .serif{font-family:var(--serif)}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--teal);color:#fff;font-weight:700;font-size:17px;
  padding:17px 22px;cursor:pointer;box-shadow:0 14px 22px -12px rgba(15,107,99,.7);transition:transform .12s,background .15s}
.btn:hover{background:var(--teal-d)} .btn:active{transform:translateY(1px)}
.btn[disabled]{background:#9bb9b5;cursor:not-allowed;box-shadow:none}
.btn.inline{display:inline-block;width:auto;padding:14px 24px;font-size:15.5px}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal);box-shadow:none}
.btn.ghost:hover{background:var(--teal-l)}
.btn.narrow{max-width:380px;margin:18px auto 4px}

/* login */
.field{display:block;text-align:left;margin:0 0 16px}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,107,99,.18)}
.err{color:var(--red);font-size:14px;min-height:20px;margin:-4px 0 8px;text-align:left}

/* picker */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.seg button{border:1.5px solid var(--line);background:var(--opt);color:var(--ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer}
.seg button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.seg.tiers button.on.t0{background:var(--t0);border-color:var(--t0)}
.seg.tiers button.on.t2{background:var(--t2);border-color:var(--t2)}
.seg.tiers button.on.t3{background:var(--t3);border-color:var(--t3)}
.srow{display:grid;grid-template-columns:34px 1fr auto 30px;align-items:center;gap:14px;background:var(--teal-l);border:1.5px solid #8fb9b2;
  border-radius:20px;padding:16px 20px;margin-bottom:12px;cursor:pointer;user-select:none;transition:.15s}
.srow.off{background:var(--opt);border-color:var(--line)}
.srow .L{font-family:var(--serif);font-weight:700;font-size:22px}
.srow .t{font-weight:700;font-size:16px} .srow .d{font-size:13.5px;color:#4a5568}
.srow .m{font-family:var(--mono);font-size:13.5px;color:#3d4658;white-space:nowrap}
.cb{width:26px;height:26px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.srow.off .cb{background:#fff;border:1.5px solid #c9c1ae}.srow.off .cb svg{visibility:hidden}
.links{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:14px 2px}
.links a{color:var(--teal);font-weight:700;cursor:pointer;margin-right:12px}
.links .mono{color:var(--muted)}
.tip{background:#fbf1de;border-left:3px solid var(--amber);border-radius:10px;padding:13px 16px;font-size:14px;margin:6px 0 18px}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-weight:700;font-size:11.5px;letter-spacing:.06em;border-radius:99px;padding:8px 14px;color:#fff;background:var(--teal)}
.pill.dark{background:var(--ink)} .pill.t0{background:var(--t0)} .pill.t1{background:var(--t1)} .pill.t2{background:var(--t2)} .pill.t3{background:var(--t3)}
.qn{font-family:var(--mono);font-size:13px;color:var(--muted)}
.clock{font-family:var(--mono);font-weight:700;font-size:20px;background:var(--opt);border:1px solid var(--line);border-radius:12px;padding:8px 18px;min-width:78px;text-align:center}
.clock.low{color:var(--red)}
.bar{height:6px;background:#e6dfcf;border-radius:9px;margin:18px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-d));transition:width .45s ease}
.bar.drain{height:7px;margin:16px 0}
.bar.drain i{background:var(--red);transition:none}
h2.q{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.25;margin:0 0 16px;letter-spacing:-.01em}
h3.h3{font-family:var(--serif);font-weight:700;font-size:21px;margin:0 0 6px}
.hl{color:var(--teal)}
.vis{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0 24px;min-height:60px}
.vis .op{font-family:var(--mono);font-size:22px;color:var(--muted)}
.opts{display:grid;gap:12px}
.opts.grid{grid-template-columns:1fr 1fr}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--opt);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;font-size:17px;cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s}
.opt:hover{background:#eee8da;border-color:#cdc5b0}
.opt.sel{background:var(--teal-l);border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.key{font-family:var(--mono);font-weight:700;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;width:26px;height:26px;
  display:inline-flex;align-items:center;justify-content:center;color:#3b4660;flex:none}
.opt.g{justify-content:center;min-height:104px;padding:12px}
.opt.g svg{display:block;max-width:100%;height:auto}
.opt.mono .otxt{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.05em}
.opt.ctr{justify-content:center;font-weight:700;font-size:17px}
.sent{background:var(--opt);border:1px solid var(--line);border-radius:16px;padding:22px 24px;font-family:var(--serif);font-size:24px;font-weight:600;line-height:2.1;word-spacing:.12em}
.w{padding:0 3px;border-radius:7px;cursor:pointer;border:2px solid transparent;display:inline-block;line-height:1.5}
.w:hover{border-color:var(--teal);background:#e3efec}
.w.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.code{background:var(--ink);color:#fff;font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:.06em;text-align:center;padding:16px 18px;border-radius:16px;overflow-wrap:anywhere}
.pair{display:flex;align-items:center;gap:14px}
.pair .code{flex:1;font-size:28px}
.vs{font-family:var(--mono);color:var(--muted);font-size:13px}

/* floating tier toast */
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-26px);opacity:0;pointer-events:none;z-index:60;
  font-family:var(--mono);font-size:14px;color:#fff;padding:12px 22px;border-radius:12px;box-shadow:0 16px 30px -10px rgba(0,0,0,.5);
  transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.down{background:var(--red)} .toast.up{background:var(--teal-d)} .toast.info{background:var(--ink)}

/* results */
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.tc{border-radius:14px;padding:14px 8px;text-align:center;color:#fff;border:1.5px solid transparent}
.tc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;opacity:.85}
.tc strong{display:block;font-family:var(--serif);font-size:20px;margin:4px 0}
.tc em{font-style:normal;font-size:11.5px;opacity:.9}
.tc.no{background:#fffdf8;color:#4a5568;border:1.5px dashed #d9cfb8}
.h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:28px 0 6px}
.brow{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto auto;gap:14px;align-items:center;background:var(--opt);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px}
.brow .nm{font-weight:700;font-size:15px}
.track{height:7px;background:#e3dccb;border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;border-radius:9px}
.brow .sc{font-family:var(--mono);font-size:13px;color:#3d4658;white-space:nowrap}
.rv{padding:16px 0;border-bottom:1px solid var(--line)}
.rvq{font-size:16px;margin-bottom:8px}
.rvq svg{max-width:100%;height:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;margin-bottom:6px}
.chip{font-size:13px;font-weight:700;border-radius:99px;padding:3px 11px}
.chip.bad{background:#f8e1d7;color:var(--red)} .chip.good{background:var(--teal-l);color:var(--teal-d)}
.rvex{font-style:italic;color:#4a5568;font-size:14px;margin:6px 0 0}
.rvans{display:flex;gap:40px;margin:8px 0 6px;flex-wrap:wrap}
.lab{display:inline-block;font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 12px;margin-bottom:8px}
.lab.bad{background:#f8e1d7;color:var(--red)} .lab.good{background:var(--teal-l);color:var(--teal-d)}
.rv .bad:not(.chip):not(.lab){background:#f8e1d7;color:var(--red);text-decoration:line-through;border-radius:6px;padding:0 4px}
.rv .good:not(.chip):not(.lab){background:var(--teal-l);color:var(--teal-d);font-weight:700;border-radius:6px;padding:0 4px}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.foot{max-width:820px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--muted);text-align:center}

@media (max-width:620px){
  .card{padding:20px 16px;border-radius:18px}
  h2.q{font-size:22px} .h-big{font-size:34px} .h1{font-size:27px}
  .srow{grid-template-columns:24px 1fr 26px;gap:10px;padding:14px} .srow .m{grid-column:2;grid-row:2}
  .srow .cb{grid-column:3;grid-row:1/3}
  .code{font-size:24px} .pair{flex-direction:column;gap:8px} .pair .code{width:100%;font-size:22px}
  .opts.grid{gap:8px} .opt{padding:14px} .tiers{grid-template-columns:1fr 1fr}
  .brow{grid-template-columns:1fr auto;} .brow .track{grid-column:1/3;order:3}
  .sent{font-size:19px;padding:16px} .toast{font-size:12.5px;padding:10px 14px}
  .who span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';

/* =========================================================
   Helpers
   ========================================================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fr=(n,d)=>{const g=gcd(Math.abs(n),d);return (n/g)+'/'+(d/g);};
const pad2=n=>String(n).padStart(2,'0');
const mmss=s=>Math.floor(s/60)+':'+pad2(s%60);
const money=p=>'£'+(p/100).toFixed(2);

const TIERS=['Foundation','Standard','Challenge','Stretch'];
const SECS=[
  {id:'vocab',name:'Vocabulary',letter:'V',desc:'Adaptive synonyms, opposites, analogies & completion.',n:14,time:600},
  {id:'maths',name:'Maths',letter:'M',desc:'Adaptive number & reasoning.',n:14,time:1500},
  {id:'nv',name:'Non-verbal',letter:'N',desc:'Shapes, rotations, mirrors, grids & cubes.',n:7,time:300},
  {id:'proof',name:'Skills · Proofreading',letter:'S',desc:'Spot the one mistake.',n:12,time:300},
  {id:'speed',name:'Skills · Speed & Accuracy',letter:'S',desc:'Codes get longer as you climb.',n:14,per:12}
];

/* =========================================================
   Question builders
   ========================================================= */
function mc(prompt,correct,wrongs,expl,extra){
  const c=String(correct),w=[];
  for(const x of wrongs){const s=String(x);if(s!==c&&!w.includes(s))w.push(s);if(w.length===3)break;}
  if(w.length<3)throw new Error('need 3 distractors: '+prompt);
  const o=shuffle([c,...w]);
  return Object.assign({kind:'mc',prompt,opts:o.map(t=>({text:t})),correct:o.indexOf(c),expl},extra||{});
}
function near(c,extra){
  const cs=shuffle([c+1,c-1,c+2,c-2,c+10,c-10,c*2,c+5,c-5,c+3,c-3,c+4,c-4,Math.round(c/2),c*10]);
  return (extra||[]).concat(cs).filter(x=>Number.isFinite(x)&&x!==c&&(c<0||x>=0));
}
function mcn(prompt,c,extra,expl,fmt,ex2){
  fmt=fmt||String;
  return mc(prompt,fmt(c),near(c,extra).map(fmt),expl,ex2);
}
/* visual options: each is {html,key}. */
function mcv(prompt,sub,visual,correct,wrongs,expl,grid){
  const w=[],seen=new Set([correct.key]);
  for(const x of wrongs){if(!seen.has(x.key)){seen.add(x.key);w.push(x);}if(w.length===3)break;}
  if(w.length<3)throw new Error('need 3 visual distractors: '+prompt);
  const o=shuffle([correct,...w]);
  return {kind:'mc',prompt,sub,visual,grid:grid!==false,opts:o.map(x=>({html:x.html})),correct:o.indexOf(correct),expl};
}

/* =========================================================
   VOCABULARY  (word|answer|distractors)
   ========================================================= */
const SYN=[
 ['happy|glad|sad,angry,tired','rapid|fast|late,slow,weak','begin|start|end,stop,wait','huge|enormous|tiny,thin,quiet','silent|quiet|loud,busy,empty','sleepy|drowsy|hungry,angry,noisy','brave|fearless|nervous,clever,lazy','tiny|small|large,heavy,rough','pal|friend|enemy,teacher,stranger','gift|present|prize,letter,toy'],
 ['peculiar|strange|pretty,clean,ordinary','fragile|delicate|smooth,loud,sturdy','abundant|plentiful|scarce,heavy,dull','weary|tired|happy,quick,brave','reluctant|unwilling|cheerful,calm,eager','diminish|shrink|grow,shine,freeze','companion|friend|enemy,guest,stranger','vast|huge|narrow,empty,ordinary','hesitate|pause|rush,laugh,agree','glimpse|quick look|long speech,loud noise,deep sleep'],
 ['meticulous|careful|careless,quick,loud','ambiguous|unclear|obvious,rude,brief','frugal|thrifty|wasteful,generous,hungry','candid|honest|shy,secretive,polite','tenacious|persistent|weak,lazy,gentle','benevolent|kind|cruel,wealthy,wise','wary|cautious|eager,sleepy,careless','conceal|hide|reveal,protect,borrow','inevitable|unavoidable|unlikely,unfair,unusual','endeavour|attempt|ignore,finish,avoid'],
 ['ephemeral|short-lived|eternal,fragile,beautiful','pragmatic|practical|dreamy,stubborn,careless','obsolete|outdated|modern,useless,worn','reticent|reserved|talkative,angry,confused','ubiquitous|everywhere|rare,hidden,ancient','lethargic|sluggish|energetic,cheerful,calm','ostentatious|showy|modest,expensive,ancient','scrutinise|examine closely|ignore,praise,repeat','ambivalent|undecided|certain,hostile,cheerful','gregarious|sociable|shy,greedy,quiet']
];
const ANT=[
 ['hot|cold|big,wet,loud','early|late|quick,first,sunny','full|empty|heavy,round,large','tall|short|thin,wide,old','win|lose|play,try,score','happy|sad|glad,kind,tired','up|down|over,high,top','night|day|dark,moon,sleep'],
 ['ancient|modern|old,tiny,huge','generous|mean|brave,bold,kind','permit|forbid|delay,ask,allow','expand|shrink|grow,stretch,widen','victory|defeat|struggle,prize,battle','arrive|depart|enter,wait,travel','rough|smooth|hard,loud,dry','bright|dull|shiny,clear,light'],
 ['scarce|plentiful|rare,tiny,valuable','optimistic|pessimistic|cheerful,realistic,confident','voluntary|compulsory|generous,optional,cheerful','ascend|descend|climb,float,rise','cautious|reckless|wary,gentle,timid','conceal|reveal|hide,cover,protect','inferior|superior|lesser,younger,weaker','vague|precise|unclear,brief,careful'],
 ['benevolent|malevolent|generous,wealthy,wise','verbose|concise|talkative,clever,quiet','transparent|opaque|clear,fragile,bright','ephemeral|permanent|brief,fragile,vivid','diligent|indolent|careful,clever,patient','lucid|obscure|bright,gentle,simple','frugal|extravagant|thrifty,hungry,gentle','amplify|diminish|repeat,broadcast,soften']
];
const CLZ=[
 ['The soup was too ___ to drink, so I waited for it to cool.|hot|cold,thin,empty','We had a ___ of fruit for lunch.|bowl|cloud,mile,note','The baby was ___, so she went to bed.|sleepy|loud,sandy,crooked','He ran ___ to catch the bus.|quickly|sadly,slowly,gently','The sun was so ___ that we had to wear hats.|bright|dull,cold,quiet'],
 ['The desert was completely ___, with no water for miles.|barren|noisy,crowded,damp','He spoke in a ___ whisper, almost impossible to hear.|faint|cheerful,sudden,loud','The explorers faced a ___ journey across the mountains.|treacherous|pleasant,brief,tiny','She was ___ to admit her mistake, so she stayed silent.|reluctant|delighted,ready,careless','The ___ weather ruined our picnic.|dreadful|delightful,pleasant,welcome'],
 ['Despite the ___ evidence, the jury found the man guilty.|overwhelming|trivial,missing,doubtful','The politician gave an ___ answer that avoided the question.|evasive|honest,direct,cheerful','Her ___ attitude made the whole team feel confident.|optimistic|gloomy,reluctant,hostile','The old bridge was too ___ to carry heavy lorries.|unstable|sturdy,valuable,famous','The scientist was ___ about her results and checked them three times.|meticulous|careless,casual,hasty'],
 ['The ___ nature of fashion means trends rarely last a year.|ephemeral|enduring,ancient,rigid','His ___ speech lasted so long that the audience grew restless.|verbose|concise,witty,moving','The manager took a ___ approach, focusing on what would actually work.|pragmatic|idealistic,reckless,whimsical','Her ___ remarks about the project angered the whole team.|disparaging|flattering,neutral,cheerful','The detective noticed a ___ detail that everyone else overlooked.|subtle|obvious,loud,enormous']
];
const ANA=[
 ['Hot is to cold as up is to ___.|down|high,over,top','Kitten is to cat as puppy is to ___.|dog|bone,tail,bark'],
 ['Hot is to cold as tall is to ___.|short|high,thin,wide','Finger is to hand as toe is to ___.|foot|nose,shoe,knee','Bird is to nest as bee is to ___.|hive|honey,flower,sting'],
 ['Author is to book as composer is to ___.|symphony|orchestra,piano,concert','Doctor is to hospital as teacher is to ___.|school|lesson,pupil,desk','Quick is to hasty as calm is to ___.|serene|noisy,hurried,upset','Drought is to water as famine is to ___.|food|hunger,rain,crops'],
 ['Telescope is to distant as microscope is to ___.|tiny|loud,bright,heavy','Legible is to read as audible is to ___.|hear|speak,loud,write','Timid is to bold as scarce is to ___.|plentiful|rare,tiny,costly','Architect is to blueprint as novelist is to ___.|manuscript|library,publisher,reader']
];
const parse=s=>{const p=s.split('|');return{w:p[0],c:p[1],d:p[2].split(',')};};
const vSyn=t=>{const e=parse(pick(SYN[t]));const W=e.w.toUpperCase();
  const p=Math.random()<.65?`Which word is closest in meaning to <b class="hl">${W}</b>?`:`What does <b class="hl">${W}</b> mean?`;
  return mc(p,cap(e.c),e.d.map(cap),`“${cap(e.w)}” means ${e.c}.`,{key:'syn'+e.w});};
const vAnt=t=>{const e=parse(pick(ANT[t]));
  return mc(`Which word is the <b class="hl">OPPOSITE</b> of <b class="hl">${e.w.toUpperCase()}</b>?`,cap(e.c),e.d.map(cap),`The opposite of “${e.w}” is “${e.c}”.`,{key:'ant'+e.w});};
const vClz=t=>{const e=parse(pick(CLZ[t]));
  return mc(`Complete: “${esc(e.w).replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}”`,e.c,e.d,`The best word is “${e.c}”.`,{key:'clz'+e.w});};
const vAna=t=>{const e=parse(pick(ANA[t]));
  return mc(`Complete the analogy: ${esc(e.w).replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}`,e.c,e.d,`The same relationship links both pairs, so the answer is “${e.c}”.`,{key:'ana'+e.w});};
const VOC=[0,1,2,3].map(t=>[()=>vSyn(t),()=>vSyn(t),()=>vAnt(t),()=>vAnt(t),()=>vClz(t),()=>vAna(t)]);

/* =========================================================
   MATHS
   ========================================================= */
const MATHS=[
[ /* Foundation */
 ()=>{const a=rnd(20,90),b=rnd(10,40),c=rnd(5,19);return mcn(`What is ${a} + ${b} − ${c}?`,a+b-c,[a+b+c,a-b+c,a+b],`${a} + ${b} = ${a+b}, then − ${c} = ${a+b-c}.`);},
 ()=>{const a=rnd(3,9),x=rnd(3,12);return mcn(`If ${a}x = ${a*x}, what is x?`,x,[a*x-a,a*x+a,a*a*x],`Divide both sides by ${a}: x = ${x}.`);},
 ()=>{const d=pick([2,3,4,5,10]),n=rnd(1,d-1),base=d*rnd(3,12),ans=base/d*n;return mcn(`What is ${n}/${d} of ${base}?`,ans,[base/d,base-ans,base/d*(n+1)],`${base} ÷ ${d} = ${base/d}, × ${n} = ${ans}.`);},
 ()=>{const p=pick([10,20,25,50]),base=rnd(2,12)*20,ans=base*p/100;return mcn(`What is ${p}% of ${base}?`,ans,[p,base-ans,base/10],`${p}% of ${base} = ${ans}.`);},
 ()=>{const h=rnd(8,18),m=pick([35,40,45,50,55]),d=rnd(20,55);let tm=h*60+m+d;const f=x=>pad2(Math.floor(x/60)%24)+':'+pad2(x%60);
   return mcn(`Clock shows ${f(h*60+m)}. Minutes until ${f(tm)}?`,d,[d+10,d-10,60-m+d],`From ${f(h*60+m)} to ${f(tm)} is ${d} minutes.`);},
 ()=>{const n=pick([3,4,5,6]),u=pick([20,25,30,35,40,45,50,60,75]);const tot=n*u;
   return mcn(`If ${n} pens cost ${money(tot)}, one pen costs?`,u,[tot-n,tot/2>>0,u+10],`${tot}p ÷ ${n} = ${u}p.`,x=>x+'p');},
 ()=>{const s=rnd(3,9)*10,t=rnd(2,5);return mcn(`A car travels ${s*t} miles in ${t} hours. Average speed?`,s,[s*t,s+t,s*t/2],`Speed = distance ÷ time = ${s*t} ÷ ${t} = ${s} mph.`,x=>x+' mph');},
 ()=>{const n=pick([8,10,12]);let k;do{k=rnd(1,n-3);}while(gcd(n-k,n)!==1);
   return mc(`A pizza has ${n} slices; you eat ${k}. What fraction is left?`,`${n-k}/${n}`,[`${k}/${n}`,`${n-k}/${k}`,`${n-k+1}/${n}`,'1/2'],`${n} − ${k} = ${n-k} slices left, so ${n-k}/${n}.`);},
 ()=>{const d=rnd(1,9),e=rnd(1,9),big=Math.random()<.5;
   const o=[`0.${d}${e}`,`0.${d}`,`0.0${d}`,`0.${d}0${e}`];
   return mc(big?'Which is largest?':'Which is smallest?',big?o[0]:o[2],big?o.slice(1):[o[0],o[1],o[3]],`Compare place values: ${big?o[0]+' is the largest':o[2]+' is the smallest'}.`);},
 ()=>{const a=rnd(12,60),b=rnd(5,30);return mcn(`What is ${a} × 3 − ${b}?`,a*3-b,[a*3+b,a+3-b,a*3],`${a} × 3 = ${a*3}, then − ${b} = ${a*3-b}.`);}
],[ /* Standard */
 ()=>{const s=rnd(2,5),k=rnd(2,4),q=[s,s*k,s*k*k,s*k*k*k],ans=s*k**4;return mcn(`Which comes next? ${q.join(', ')}, …`,ans,[q[3]*2,q[3]+(q[3]-q[2]),q[3]+k],`Multiply by ${k} each time: ${q[3]} × ${k} = ${ans}.`);},
 ()=>{const p=pick([[2,3],[3,4],[3,5],[2,5],[4,5],[5,6],[1,4],[3,7]]),g=rnd(2,6),a=p[0]*g,b=p[1]*g;
   return mc(`Simplify ${a} : ${b}.`,`${p[0]}:${p[1]}`,[`${p[1]}:${p[0]}`,`${p[0]}:${p[1]+1}`,`${p[0]+1}:${p[1]}`,`${p[0]*2}:${p[1]*2}`],`Divide both by ${g}: ${p[0]} : ${p[1]}.`);},
 ()=>{const y=rnd(4,9),z=rnd(2,y-1);return mcn(`If y = ${y}, z = ${z}, what is y² − z²?`,y*y-z*z,[(y-z)*(y-z),y*2-z*2,y*y+z*z],`${y*y} − ${z*z} = ${y*y-z*z}.`);},
 ()=>{const bd=pick([[2,4],[3,6],[4,8],[5,10],[2,6],[3,9],[4,12],[2,8]]),b=bd[0],d=bd[1],a=rnd(1,b-1),c=rnd(1,d-1);const nn=a*d/b+c;
   return mc(`What is ${a}/${b} + ${c}/${d}?`,fr(nn,d),[`${a+c}/${b+d}`,`${a+c}/${d}`,fr(nn+1,d),`${a+c}/${b}`],`Use denominator ${d}: ${a*d/b}/${d} + ${c}/${d} = ${nn}/${d}${gcd(nn,d)>1?' = '+fr(nn,d):''}.`);},
 ()=>{const p=pick([[4,6],[6,8],[6,9],[4,10],[8,12],[6,10],[9,12],[10,15],[12,18]]),l=lcm(p[0],p[1]);
   return mcn(`Smallest multiple of both ${p[0]} and ${p[1]}?`,l,[p[0]*p[1],l/2|0,l+p[0]],`The lowest common multiple of ${p[0]} and ${p[1]} is ${l}.`);},
 ()=>{const a=rnd(3,12),b=rnd(2,9),c=rnd(2,9);return mcn(`What is ${a} + ${b} × ${c}?`,a+b*c,[(a+b)*c,a*b+c,a+b+c],`Multiply first: ${b} × ${c} = ${b*c}, then + ${a} = ${a+b*c}.`);},

    const cells=[];const all=shuffle([...Array(n*n).keys()]).slice(0,rnd(cnt[0],cnt[1]));all.forEach(i=>cells.push([Math.floor(i/n),i%n]));
    const apply=f=>cells.map(x=>f(x[0],x[1]));
    const keys=new Set([gk(cells),...names.map(m=>gk(apply(ops[m])))]);
    if(keys.size<7)continue;
    const op=pick(allowed),cor=apply(ops[op]);
    let wr=names.filter(m=>m!==op).map(m=>apply(ops[m])).concat([cells]);
    if(t>=2){const v=cor.map(x=>x.slice());const i=rnd(0,v.length-1);const free=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!v.some(x=>x[0]===r&&x[1]===c))free.push([r,c]);if(free.length){v[i]=pick(free);wr.unshift(v);}}
    return mcv(`Which grid shows the pattern ${op}?`,'Look at which squares are shaded and where they end up.',gridSVG(cells,n),{html:gridSVG(cor,n),key:gk(cor)},shuffle(wr).map(w=>({html:gridSVG(w,n),key:gk(w)})),`Apply the move to every shaded square: the result is the highlighted grid.`);
  }
  throw new Error('grid');
}
const NV=[0,1,2,3].map(t=>[()=>genTake(t),()=>genArrow(t),()=>genMirror(t),()=>genCubes(t),()=>genPoly(t),()=>genGrid(t)]);

/* =========================================================
   PROOFREADING
   ========================================================= */
const PR=[
 ['The dog ran quickly *accross* the field.|across|Spelling: “across” has one c.','She *have* got a new red bike.|has|“She has got”.','He *dont* like carrots.|doesn’t|“He doesn’t” — it needs an apostrophe.','*Their* going to the park after lunch.|They’re|“They’re” means “they are”.','We visited *paris* during the holidays.|Paris|Place names take a capital letter.','*my* friend lives next door.|My|A sentence starts with a capital letter.','We *was* very tired after the walk.|were|“We were”.','He is *verry* tall for his age.|very|Spelling: “very” has one r.','She *runned* to the shop.|ran|The past tense of “run” is “ran”.','He *go* to school every day.|goes|“He goes”.'],
 ['The *childrens* toys were on the floor.|children’s|“Children” is already plural, so add ’s.','He *recieved* a letter from his cousin.|received|“i before e, except after c”.','My brother and *me* went to town.|I|“My brother and I went”.','I can’t wait *too* see the movie.|to|“to” goes before a verb.','*Theirs* a spider on the wall.|There’s|“There’s” means “there is”.','I should *of* studied harder.|have|It is “should have”.','The teacher gave us *alot* of homework.|a lot|“a lot” is two words.','It was a *beautifull* day.|beautiful|Spelling: “beautiful” ends in -ful.'],
 ['Neither of the boys *were* ready for the test.|was|“Neither” takes a singular verb.','She *seperated* the red socks from the white ones.|separated|Spelling: “sep-a-rate”.','The company announced *it’s* new policy yesterday.|its|“its” (no apostrophe) shows ownership.','He is taller *then* his sister.|than|Use “than” to compare.','The *principle* of the school welcomed the new pupils.|principal|“Principal” is the head of a school.','Between you and *I*, the film was boring.|me|After “between”, use “me”.','Each of the players *have* a water bottle.|has|“Each” takes a singular verb.','How does the weather *effect* your mood?|affect|“Affect” is the verb; “effect” is the noun.','The *womens* changing room was locked.|women’s|“Women” is plural, so add ’s.'],
 ['The *committe* met on Tuesday to discuss the budget.|committee|Double m, double t, double e.','It was an *embarassing* moment for everyone.|embarrassing|Double r and double s.','Whom did you *saw* at the party?|see|After “did”, use the base verb.','There is *fewer* water in the lake than last year.|less|“Less” is for things you cannot count.','Despite *of* the rain, we played outside.|(delete it)|“Despite” is never followed by “of”.','The team celebrated *there* victory all night.|their|“Their” shows ownership.','She asked *weather* it would rain tomorrow.|whether|“Whether” introduces a question.','The *dissapointed* fans left early.|disappointed|One s, two p’s.','Everyone *have* to bring a packed lunch.|has|“Everyone” takes a singular verb.','I *accidentaly* spilled juice on the carpet.|accidentally|Add -ally, not -aly.']
];
function genProof(t){
  const p=pick(PR[t]).split('|');
  const toks=p[0].split(' ').map(w=>({t:w.replace(/\*/g,''),e:w.indexOf('*')>=0}));
  const ei=toks.findIndex(x=>x.e);
  return {kind:'proof',toks,correct:ei,key:'pr'+p[0],expl:`“${toks[ei].t}” → “${p[1]}”. ${p[2]}`};
}

/* =========================================================
   SPEED & ACCURACY
   ========================================================= */
const POOL='abdeghkmnprstuvyzABDEFGHKLMNPRSTXYZ23456789';
const LOOK={O:'0','0':'O',l:'1','1':'l',I:'l',n:'h',h:'n',m:'n',u:'v',v:'u',b:'d',d:'b',p:'q',q:'p',g:'9','9':'g','5':'S',S:'5','2':'Z',Z:'2','8':'B',B:'8',C:'G',G:'C',E:'F',F:'E',r:'n',e:'c',c:'e'};
const rc=n=>{let s='';for(let i=0;i<n;i++)s+=pick(POOL);return s;};
function mutate(code,t){
  const a=code.split(''),idx=a.map((c,i)=>c==='-'?-1:i).filter(i=>i>=0);
  if(t>=2&&Math.random()<.3){for(let k=0;k<12;k++){const i=pick(idx);if(idx.includes(i+1)&&a[i]!==a[i+1]){[a[i],a[i+1]]=[a[i+1],a[i]];return a.join('');}}}
  const k=pick(idx),c=a[k];let n=(LOOK[c]&&Math.random()<(t>=1?.75:.45))?LOOK[c]:pick(POOL);let g=0;while(n===c&&g++<20)n=pick(POOL);if(n===c)n=c==='x'?'y':'x';a[k]=n;return a.join('');
}
function genSpeed(t){
  if(Math.random()<.5){
    const code=rc([4,5,6,8][t]);const set=new Set([code]);let g=0;
    while(set.size<4&&g++<60)set.add(mutate(code,t));
    if(set.size<4)throw new Error('speed');
    const o=shuffle([...set]);
    return {kind:'mc',style:'speed-match',code,opts:o.map(x=>({text:x})),correct:o.indexOf(code),key:'sm'+code,expl:'Compare character by character — the trap is usually a look-alike (O/0, l/1, n/h).'};
  }
  const l=[[5],[5,5],[5,6],[6,6]][t],a=l.map(rc).join('-'),same=Math.random()<.5,b=same?a:mutate(a,t);
  return {kind:'mc',style:'speed-pair',code:a,code2:b,opts:[{text:'Same'},{text:'Different'}],correct:same?0:1,key:'sp'+a+b,expl:same?'The two codes are identical.':'One character is different — check look-alikes (O/0, l/1, n/h).'};
}

const GENS={vocab:VOC,maths:MATHS,nv:NV,proof:[0,1,2,3].map(t=>[()=>genProof(t)]),speed:[0,1,2,3].map(t=>[()=>genSpeed(t)])};

function makeQ(secId,tier,state){
  const list=GENS[secId][tier];
  for(let tries=0;tries<40;tries++){
    let idx;const free=list.map((_,i)=>i).filter(i=>!state.recent.includes(i));
    idx=pick(tries<20&&free.length?free:list.map((_,i)=>i));
    let q;try{q=list[idx]();}catch(e){continue;}
    q.key=q.key||(q.prompt+'|'+(q.opts||[]).map(o=>o.text||'').join(','));
    if(state.used.has(q.key)&&tries<30)continue;
    state.used.add(q.key);state.recent.push(idx);if(state.recent.length>2)state.recent.shift();
    q.tier=tier;return q;
  }
  throw new Error('could not generate '+secId);
}

  app().innerHTML=`<div class="card">
    <span class="chip-s">RESULTS</span>
    <div class="center"><div class="small mono" style="letter-spacing:.12em;margin-top:18px">${eyebrow} —</div>
    <h1 class="h-big" style="color:var(--teal);margin-top:6px">${TIERS[best]} tier</h1>
    <p class="lead" style="margin:0 auto">${esc(S.user)} (${esc(S.cls)}) · ${msg}</p></div>
    <div class="tiers">${TIERS.map((x,i)=>i<=best?`<div class="tc" style="background:${tcolor[i]}"><small>TIER ${i+1}</small><strong>${x}</strong><em>${i<best?'cleared':'← your best'}</em></div>`:`<div class="tc no"><small>TIER ${i+1}</small><strong>${x}</strong><em>not reached yet</em></div>`).join('')}</div>
    <h2 class="h2">By section</h2>
    <p class="sub">The chip shows the highest tier reliably reached in that section (2 or more correct at that tier). Skipped or timed-out questions count as wrong.</p>
    ${secs.map(x=>`<div class="brow"><div class="nm">${esc(x.sec.name)}</div><div class="track"><i style="width:${x.pct}%;background:${x.pct>=80?'var(--teal)':x.pct>=60?'var(--amber)':'var(--red)'}"></i></div><div class="sc">${x.ok}/${x.n} · ${x.pct}%</div><span class="pill t${x.best}">${TIERS[x.best].toUpperCase()}</span></div>`).join('')}
    <h2 class="h2">Review your misses</h2>
    ${misses.length?misses.map(reviewItem).join(''):'<p class="sub">No misses — perfect run!</p>'}
    <h2 class="h2">Your recent attempts</h2>
    <table class="hist"><tr><th>DATE</th><th>TIER</th><th>SCORE</th></tr>${mine.map(m=>`<tr><td>${new Date(m.d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</td><td>${esc(m.tier)}</td><td>${m.pct}%</td></tr>`).join('')}</table>
    <div class="actions"><button class="btn inline" id="again">Repeat these sections</button><button class="btn inline ghost" id="choose">Choose sections</button></div></div>`;
  $('#again').onclick=()=>{startRun();};
  $('#choose').onclick=()=>{showPicker();};
  window.scrollTo(0,0);cur=null;
}

document.addEventListener('keydown',e=>{
  if(screen!=='quiz'||!cur||cur.done||cur.locked||!cur.q||cur.q.kind==='proof')return;
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toUpperCase();let i='ABCD'.indexOf(k);if(i<0)i='1234'.indexOf(k);
  if(i>=0&&i<cur.q.opts.length)answer(i);
});

/* test hook / boot */
if(typeof document==='undefined'||!document.getElementById('app')){globalThis.__T={makeQ,SECS,GENS};}
else{setWho();showLogin();}
})();
</script>
</body>
</html>
