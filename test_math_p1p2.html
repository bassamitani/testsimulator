  /* Core Base Styles */
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc;
    padding: 2rem 1.5rem;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin: 0;
  }
  .quiz-container {
    width: 100%;
    max-width: 650px;
    background: #ffffff;
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }

  /* Typography */
  h2 { font-size: 1.75rem; font-weight: 800; color: #0f172a; text-align: center; margin: 0 0 0.5rem 0; }
  p { margin: 0 0 1.5rem 0; font-size: 0.95rem; line-height: 1.5; color: #475569; }
  .alert-text { color: #dc2626; font-weight: 700; text-align: center; font-size: 0.9rem; }

  /* Form Inputs & Elements */
  .input-field {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    margin-bottom: 1rem;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-field:focus { border-color: #4f46e5; }

  /* Custom Informational Box */
  .notice-box {
    background: #fffbeb;
    border: 1px solid #fef3c7;
    color: #92400e;
    padding: 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
    margin-bottom: 1.5rem;
  }

  /* Interactive Control Buttons */
  .primary-btn {
    width: 100%;
    background: #4f46e5;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    padding: 0.85rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .primary-btn:hover { background: #4338ca; }

  .opt-btn {
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    transition: all 0.2s;
    background: #fff;
    font-weight: 500;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .opt-btn:hover { border-color: #cbd5e1; }
  .opt-btn.selected { border-color: #4f46e5; background: #e0e7ff; color: #4338ca; }

  /* Layout Controls */
  .hidden { display: none; }
  .text-center { text-align: center; }

  /* Performance Tracking Panels */
  #timer-bar { background: #fef2f2; color: #dc2626; font-weight: 700; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; border: 1px solid #fee2e2; }
  #progress { color: #4f46e5; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; text-align: center; margin-bottom: 0.5rem; }
  #question-text { font-size: 1.05rem; color: #1e293b; margin-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1rem; line-height: 1.6; }
  .report-row { border-bottom: 1px solid #f1f5f9; padding: 14px 0; font-size: 0.9rem; }
  .report-meta-panel { margin-bottom: 1rem; font-size: 0.9rem; background: #f8fafc; padding: 1rem; border-radius: 8px; }
  .scroll-box { max-height: 400px; overflow-y: auto; padding-right: 0.5rem; }
  .score-large { font-size: 3.75rem; font-weight: 900; color: #4f46e5; margin-bottom: 1rem; }
 </style>

 </div>

   <button onclick="location.reload()" class="primary-btn" style="background: #0f172a;">Retake Test</button>
 </div>

 <!-- Detailed Performance Report Screen -->

 </div>
</div>

let quizSet = [], currentIdx = 0, score = 0, userAnswers = [], timeLeft = QUIZ_DURATION_MINS * 60, timerInterval;
let quizStartTime, quizEndTime, studentName, studentClass;

function handleLogin(e) {
  e.preventDefault();
  studentName = document.getElementById('userName').value;
  studentClass = document.getElementById('classSection').value;
  startNewQuiz();
}

function startNewQuiz() {
  quizStartTime = new Date();

  quizSet = masterData.map(q => {
    if (q.type === 'mcq') {
      return { ...q, options: [...q.options].sort(() => Math.random() - 0.5) };
    }
    return q;
  }).sort(() => Math.random() - 0.5);

  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  startTimer();
  renderQuestion();
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let mins = Math.floor(timeLeft / 60), secs = timeLeft % 60;
    document.getElementById('timer-clock').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    if (timeLeft <= 0) finishQuiz();
  }, 1000);
}
function renderQuestion() {
  const q = quizSet[currentIdx];
  document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${quizSet.length}`;
  document.getElementById('question-text').innerHTML = q.question;
  const ansSection = document.getElementById('answer-section');
  ansSection.innerHTML = '';

  if (q.type === 'mcq') {
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn'; btn.innerHTML = opt;
      btn.onclick = () => {
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        q.temp = opt;
      };
      ansSection.appendChild(btn);
    });
  } else {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'input-field';
    input.style.textAlign = 'center';
    input.style.fontWeight = '600';
    input.placeholder = 'Type your clear numerical solution here...';
    input.oninput = (e) => q.temp = e.target.value;
    ansSection.appendChild(input);
  }

// Replace this block inside renderQuestion() right before "document.getElementById('next-btn').onclick..."
if (typeof renderMathInElement === 'function') {
  renderMathInElement(document.getElementById('quiz-screen'), {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false}
    ],
    throwOnError: false
  });
}

  document.getElementById('next-btn').onclick = nextQuestion;
}

function nextQuestion() {
  const q = quizSet[currentIdx];
  if (!q.temp) return alert("Please input or choose an answer before moving forward!");

  const isRight = q.temp.toString().toLowerCase().trim() === q.answer.toString().toLowerCase().trim();
  userAnswers.push({ q: q.question, user: q.temp, correct: q.answer, isRight });

  if (isRight) score++;
  currentIdx++;

  if (currentIdx < quizSet.length) {
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  quizEndTime = new Date();
  clearInterval(timerInterval);
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  const final = Math.round((score / quizSet.length) * 100);
  document.getElementById('score-display').innerText = `${final}%`;
  document.getElementById('score-text').innerText = `Total Score: ${score} / ${quizSet.length} Correct Answers`;
}

function showReport() {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('report-screen').classList.remove('hidden');
  const diffMs = quizEndTime - quizStartTime;
  const diffMins = Math.floor(diffMs / 60000), diffSecs = Math.floor((diffMs % 60000) / 1000);

  document.getElementById('report-meta').innerHTML = `
    <div style='margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid #e2e8f0;'>
      <p style='margin:0;'><strong>Student:</strong> ${studentName}</p>
      <p style='margin:0;'><strong>Class:</strong> ${studentClass}</p>
    </div>
    <p style='margin:0;'><strong>Total Duration:</strong> ${diffMins}m ${diffSecs}s</p>
    <p style='margin:0;'><strong>Completion Status:</strong> ${userAnswers.length} of ${quizSet.length} Solved</p>
  `;

  document.getElementById('report-content').innerHTML = userAnswers.map((a, i) => `
    <div class="report-row">
      <div style="margin-bottom:4px; color:#334155;"><strong>Q${i+1}:</strong> ${a.q}</div>
      <p style="margin:0;" class="${a.isRight ? 'text-emerald-600' : 'text-red-600'}"><strong>Your Answer:</strong> ${a.user}</p>
      ${!a.isRight ? `<p style="margin:0; color:#64748b; font-size:0.8rem;"><strong>Correct Baseline:</strong> \${a.correct}</p>` : ''}
    </div>
  `).join('');

  if (typeof renderMathInElement === 'function') {
    renderMathInElement(document.getElementById('report-content'), {
      delimiters: [
        {left: "\[", right: "\]", display: true},
        {left: "\(", right: "\)", display: false}
      ]
    });
  }
}

function backToSummary() {
  document.getElementById('report-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
}
