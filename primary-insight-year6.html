:root{--frame:#7ea2cb;--frame2:#6c93c2;--blue:#4f86c0;--bt:#6f9bcb;--cream:#fdf1cf;--creamb:#f0dd9d;--ink:#161c2b;--pale:#e8eff8;--ok:#2e8b57;--red:#c8532b;
 --font:'Outfit','Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:linear-gradient(#e9f0f9,#dbe6f3);min-height:100vh;line-height:1.4;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #f5b800;outline-offset:2px}
.top{max-width:940px;margin:0 auto;padding:14px 18px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:700;font-size:21px;color:#2c4f80;display:flex;gap:9px;align-items:center}
.logo small{font-size:10px;letter-spacing:.08em;background:#fde3d8;color:var(--red);padding:3px 9px;border-radius:99px}
.who{font-size:14px;color:#44587a;display:flex;gap:12px;align-items:center}
.who a{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline}
.stage{max-width:940px;margin:0 auto;padding:6px 14px 40px}
.frame{background:linear-gradient(#86a9d1,#6f96c5);border-radius:26px;padding:15px;box-shadow:0 24px 40px -24px rgba(25,55,105,.65)}
.panel{background:#fffefb;border-radius:20px;padding:26px 32px 20px;min-height:540px;position:relative;box-shadow:0 0 0 5px rgba(255,255,255,.55) inset,0 0 22px rgba(255,255,255,.9) inset;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.qt{font-size:26px;font-weight:600;color:#111}
.qt span{color:var(--bt);font-size:21px;font-weight:500;margin-left:12px}
.instr{color:var(--bt);font-size:14.5px;line-height:1.5;max-width:660px;margin:8px 0 12px}
.q{font-size:20px;margin:12px 0}
.icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.mid{min-height:300px}
.fbar{display:flex;gap:10px;align-items:center;margin-top:16px}
.msg{flex:1;background:#fff;border:2px solid #cfdcec;border-radius:12px;padding:11px 16px;font-size:18px;min-height:46px;display:flex;align-items:center}
.btn2{background:#fff;border:2px solid var(--bt);border-radius:11px;padding:9px 18px;font-size:16px;font-weight:500;cursor:pointer;display:inline-flex;gap:8px;align-items:center;min-height:42px}
.btn2:hover{background:#eef4fb}
.btn2[disabled]{opacity:.4;cursor:not-allowed}
.btn2.ghost{border-color:#cfdcec;color:#8aa0bd}
.spacer{flex:1}
.ans{background:var(--cream);border:3px solid var(--frame);border-radius:13px;font-size:23px;padding:14px 12px;cursor:pointer;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%}
.ans:hover{background:#ffeaae}
.ans.sel{background:#ffe27a;border-color:#3c74b3;box-shadow:0 0 0 3px rgba(60,116,179,.25)}
.ans svg{max-width:100%;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;margin:14px auto 0}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:14px auto 0}
.bigbox{max-width:640px;margin:8px auto 14px;border:3px solid var(--frame);border-radius:13px;padding:34px 16px;text-align:center;font-size:30px;font-weight:600}
.pv{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,124px);gap:8px;max-width:560px;margin:6px auto;justify-items:center;align-items:center}
.pt{width:124px;height:124px;background:#fff;border:3px solid var(--frame);border-radius:10px;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center}
.pt:hover{border-color:#3c74b3}.pt.sel{background:#ffe27a;border-color:#3c74b3}
.pt svg{width:100%;height:100%}
.p0{grid-area:1/1}.p1{grid-area:1/3}.p2{grid-area:2/2}.p3{grid-area:3/1}.p4{grid-area:3/3}
.mx{display:flex;gap:34px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.mg{display:grid;grid-template-columns:repeat(3,76px);gap:6px}
.mc{width:76px;height:76px;background:#fff;border:2px solid #b8c4d2;border-radius:3px;display:block}
.mc.miss{background:radial-gradient(#fff,#8a8f96);display:flex;align-items:center;justify-content:center;font-size:34px;color:#222;font-weight:500}
.mo{display:grid;grid-template-columns:repeat(2,94px);gap:12px}
.mo .ans{padding:5px;min-height:94px;background:#fff;border:3px solid var(--frame);outline:0}
.mo .ans.sel{background:#ffe27a}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px;margin:10px auto 0}
.keys button{min-width:46px;height:46px;font-size:22px;background:var(--cream);border:3px solid var(--frame);border-radius:10px;cursor:pointer;padding:0 8px}
.keys button:hover{background:#ffeaae}.keys .wide{min-width:110px}
.keys .brk{flex-basis:100%;height:0}
.abox{max-width:600px;min-height:62px;margin:12px auto 0;background:var(--cream);border:3px solid var(--frame);border-radius:11px;font-size:30px;font-weight:600;padding:9px 16px;text-align:center;letter-spacing:.05em;overflow-wrap:anywhere}
.abox.empty:after{content:'\00a0'}
.sentence{font-size:21px;text-align:center;margin:8px 0 6px}
.cw{display:flex;gap:44px;align-items:center;justify-content:center;margin:70px 0 40px;font-size:32px;font-weight:600}
.cw .p{color:#1f7a3f}.cw input{font:inherit;font-size:26px;width:240px;padding:5px 10px;border:2px solid var(--bt);border-radius:6px;outline:none;font-weight:500}
.cw .done{color:#1f7a3f;font-size:32px;font-weight:700}

function misspell(w){
  const v=new Set(),vow='aeiou',sw=(s,i)=>s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2);
  for(let i=0;i<w.length-1;i++)if(w[i]!==w[i+1])v.add(sw(w,i));
  for(let i=0;i<w.length;i++){
    v.add(w.slice(0,i)+w.slice(i+1));
    if(vow.includes(w[i])){for(const c of vow)if(c!==w[i])v.add(w.slice(0,i)+c+w.slice(i+1));}
    else v.add(w.slice(0,i+1)+w[i]+w.slice(i+1));
  }
  if(w.includes('ie'))v.add(w.replace('ie','ei'));if(w.includes('ei'))v.add(w.replace('ei','ie'));
  [['ph','f'],['ck','k'],['ous','us'],['tion','shun'],['ough','uff'],['ight','ite'],['ce','se']].forEach(p=>{if(w.includes(p[0]))v.add(w.replace(p[0],p[1]));});
  v.delete(w);return shuffle([...v].filter(x=>x.length>=2&&/^[a-z]+$/i.test(x)));
}

   case 10:return t===0?{txt:`${d1(R(15,90)/10)} + ${d1(R(12,80)/10)}`,get ans(){return d1(parseFloat(this.txt.split(' + ')[0])+parseFloat(this.txt.split(' + ')[1]));}}:t===1?mul(R(13,35),pick([15,25,12,14])):t===2?div(R(12,40),pick([13,15,16,25])):{txt:`${pick([3.5,4.2,6.7,0.9])*10} ÷ 10`,get ans(){return d1(parseFloat(this.txt)/10);}};

function makeQ(mod,L,st){
  const all=GEN[mod],M=MODS.find(m=>m.id===mod),comp=M.order[st.i%M.order.length];
  for(let t=0;t<80;t++){
    let c=all.filter(g=>(!comp||g.comp===comp)&&L>=g.lo&&L<=g.hi);
    if(!c.length||t>40)c=all.filter(g=>!comp||g.comp===comp).sort((a,b)=>Math.min(Math.abs(a.lo-L),Math.abs(a.hi-L))-Math.min(Math.abs(b.lo-L),Math.abs(b.hi-L))).slice(0,3);
    if(!c.length)c=all;
    const fresh=c.filter(g=>!st.recent.includes(g)),g=pick(fresh.length?fresh:c);let q;
    try{q=g.fn(L,st);}catch(e){continue;}
    q.comp=q.comp||g.comp;q.level=L;q.key=q.key||String(Math.random());
    if(st.used.has(q.key)&&t<60)continue;
    st.used.add(q.key);st.recent.push(g);if(st.recent.length>2)st.recent.shift();return q;
  }
  throw new Error('generation failed '+mod+' '+L);
}

   <button class="big" id="st" ${n?'':'disabled'}>Start practice ${ARROW.replace('#6f9bcb','#fff')}</button>
   <p class="note">Tip: if a question is hard, make your best guess and move on. Sound is used in Spelling and Picture Vocabulary — turn your volume on.</p></div>`;
  panel().querySelectorAll('.mod').forEach(r=>{const t=()=>{const id=r.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);showPicker();};r.onclick=t;r.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t();}};});

function startRun(){run={mods:MODS.filter(m=>S.sel.has(m.id)),mi:0,res:{},date:Date.now()};showIntro();}
function showIntro(){

function beginMod(m){

function nextQ(){

/* ---------- rendering ---------- */
function ready(q){switch(q.type){case 'mc':return q.resp!=null;case 'type':return q.resp!=null&&String(q.resp).length>0;case 'sign':return q.resp!=null;case 'cloze':return q.resp&&q.resp.length===q.gaps.length&&q.resp.every(x=>x!=null);case 'dots':return q.resp&&q.resp.size>0;}return false;}
function check(q){switch(q.type){
 case 'mc':return q.resp===q.correct;
 case 'type':{const r=String(q.resp).trim().toLowerCase();if(q.numeric)return q.answers.some(a=>Math.abs(parseFloat(r)-parseFloat(a))<1e-9);if(q.kb==='cw')return q.answers.some(a=>a===(q.prefix+r)||a===r);return q.answers.includes(r);}
 case 'sign':return q.resp===q.correct;
 case 'cloze':{const ok=q.resp.filter((x,i)=>x===q.gaps[i].right).length;return ok>=q.gaps.length-(q.gaps.length>=5?1:0);}
 case 'dots':{if(q.resp.size!==q.want.size)return false;for(const x of q.resp)if(!q.want.has(x))return false;return true;}}return false;}
function renderQ(){
  const q=cur.q;let mid='',foot='';

    if(q.layout==='pv')mid=`<div class="mid"><div class="pv">${q.opts.map((o,i)=>`<button class="pt p${i}" data-i="${i}" aria-label="picture ${i+1}">${o}</button>`).join('')}</div></div>`;
    else if(q.layout==='matrix')mid=`<div class="mid"><div class="mx">${q.matrix}<div class="mo">${q.opts.map((o,i)=>`<button class="ans" data-i="${i}" aria-label="option ${'ABCD'[i]}">${o}</button>`).join('')}</div></div></div>`;
    else mid=`<div class="mid">${q.body}<div class="${q.layout}">${q.opts.map((o,i)=>`<button class="ans" data-i="${i}">${q.raw?o:esc(o)}</button>`).join('')}</div></div>`;
  }else if(q.type==='type'){
    if(q.kb==='cw')mid=`<div class="mid"><div class="cw"><span>${esc(cap(q.word))}</span><span><span class="p">${esc(q.prefix.toUpperCase())}</span> <input id="cwin" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="30" aria-label="missing letters"></span></div></div>`;
    else if(q.kb==='num')mid=`<div class="mid">${q.body}<div class="abox empty" id="abox"></div><div class="keys">${'1234567890'.split('').map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button data-k=".">.</button><button class="wide" data-k="back">back</button></div></div>`;
    else mid=`<div class="mid">${q.body}<div class="abox empty" id="abox"></div><div class="keys">${[['abcdef'],['ghijklmnop'],['qrstuvwxyz']].map(r=>r[0].split('').map(k=>`<button data-k="${k}">${k}</button>`).join('')+'<span class="brk"></span>').join('')}<button class="wide" data-k=" ">space</button><button class="wide" data-k="back">back</button></div></div>`;
  }else if(q.type==='sign'){
    mid=`<div class="mid"><p class="q" style="margin:6px 0">Complete the calculation</p><div class="sg">${['+','−','×','÷'].map(o=>`<div class="op" draggable="true" data-o="${o}">${o}</div>`).join('')}</div><div class="eq"><span>${q.left}</span><div class="slot" id="slot">?</div><span>${q.right} = ${q.res}</span></div></div>`;
  }else if(q.type==='cloze'){
    mid=`<div class="mid"><div class="passage">${q.parts.map(p=>p.t!=null?esc(p.t):`<span class="gap">${q.gaps[p.g].opts.map(o=>`<button data-g="${p.g}" data-w="${esc(o)}">${esc(o)}</button>`).join('')}</span>`).join('')}</div></div>`;
  }else if(q.type==='dots'){
    const n=q.n;mid=`<div class="mid"><div class="dots"><div class="dpanel">${q.left}</div><div class="dpanel"><div class="dgrid" style="grid-template-columns:repeat(${n},36px)">${Array.from({length:n*n},(_,i)=>`<button data-d="${Math.floor(i/n)},${i%n}" aria-label="circle"></button>`).join('')}</div></div></div></div>`;
  }
  const hasSnd=q.speak||q.word&&q.layout==='pv';
  if(q.layout==='pv'||q.kb==='alpha'||q.type==='dots')foot=`<div class="fbar">${q.layout==='pv'?`<div class="msg">${esc(q.word)}</div>`:'<div class="spacer"></div>'}${hasSnd?`<button class="btn2 ghost" id="again" style="color:#4a6d99">Again ↻</button>`:q.type==='dots'?'<button class="btn2" id="clear">Clear</button>':''}<button class="btn2" id="next" disabled>Next ${ARROW}</button></div>`;
  else foot=`<div class="fbar"><div class="spacer"></div><button class="btn2" id="next" disabled>Next ${ARROW}</button></div>`;
  panel().innerHTML=`<div class="qt">Question ${cur.i+1} of ${cur.n}<span>${esc(q.title)}</span></div><p class="instr">${q.instr}</p>${mid}${foot}`;
  bindQ(q);
  if(q.speak&&(q.kb==='alpha'||q.layout==='pv'))setTimeout(()=>speak(q.speak),250);
}
function bindQ(q){
  const P=panel(),nx=$('#next'),upd=()=>{nx.disabled=!ready(q);};nx.onclick=onNext;
  if($('#again'))$('#again').onclick=()=>speak(q.speak);
  if(q.type==='mc')P.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{q.resp=+b.dataset.i;P.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('sel',x===b));upd();});
  if(q.type==='type'){
    if(q.kb==='cw'){const inp=$('#cwin');inp.focus();inp.oninput=()=>{let t=inp.value.toLowerCase().replace(/[^a-z]/g,'');inp.value=t;
      const full=q.answers[0],pl=q.prefix.length;
      if(t.length>=2&&full.slice(pl,pl+2)===t.slice(0,2)){q.resp=full.slice(pl);inp.parentNode.innerHTML=`<span class="done">${esc(full)}</span>`;}else q.resp=t;upd();};}
    else{q.resp='';const box=$('#abox'),draw=()=>{box.textContent=q.resp;box.classList.toggle('empty',!q.resp);};
      q.press=k=>{if(k==='back')q.resp=q.resp.slice(0,-1);else if(q.resp.length<24&&!(k==='.'&&q.resp.includes('.')))q.resp+=k;draw();upd();};
      P.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>q.press(b.dataset.k));}
  }
  if(q.type==='sign'){
    const slot=$('#slot'),setOp=o=>{q.resp=o;slot.textContent=o;P.querySelectorAll('.op').forEach(x=>x.classList.toggle('sel',x.dataset.o===o));upd();};
    P.querySelectorAll('.op').forEach(el=>{el.onclick=()=>setOp(el.dataset.o);el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.o);};});
    slot.ondragover=e=>{e.preventDefault();slot.classList.add('over');};slot.ondragleave=()=>slot.classList.remove('over');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('over');setOp(e.dataTransfer.getData('text/plain'));};
  }
  if(q.type==='cloze'){q.resp=Array(q.gaps.length).fill(null);P.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;q.resp[g]=b.dataset.w;P.querySelectorAll(`[data-g="${g}"]`).forEach(x=>x.classList.toggle('sel',x===b));upd();});}
  if(q.type==='dots'){q.resp=new Set();P.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=b.dataset.d;q.resp.has(k)?q.resp.delete(k):q.resp.add(k);b.classList.toggle('on',q.resp.has(k));upd();});
    $('#clear').onclick=()=>{q.resp.clear();P.querySelectorAll('[data-d]').forEach(b=>b.classList.remove('on'));upd();};}
}
document.addEventListener('keydown',e=>{
  if(screen!=='quiz'||!cur||!cur.q)return;const q=cur.q;
  if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&ready(q)){onNext();return;}
  if(q.type==='type'&&q.press&&!e.ctrlKey&&!e.metaKey){
    if(e.key==='Backspace'){q.press('back');e.preventDefault();}
    else if(q.kb==='num'&&/^[0-9.]$/.test(e.key))q.press(e.key);
    else if(q.kb==='alpha'&&/^[a-zA-Z ]$/.test(e.key)){q.press(e.key.toLowerCase());e.preventDefault();}
  }
});
function onNext(){
  const q=cur.q;if(!ready(q))return;const ok=check(q);
  cur.items.push({l:q.level,ok,g:q.g,comp:q.comp});cur.rev.push({q,ok,resp:q.type==='dots'?[...q.resp]:q.resp});

  if(cur.i>=cur.n)endMod();else nextQ();
}
function endMod(){
  const th=cur.th,ae=lvMonths(th),comps={};
  [...new Set(cur.items.map(x=>x.comp).filter(Boolean))].forEach(c=>{const it=cur.items.filter(x=>x.comp===c);if(it.length>=2)comps[c]={ae:lvMonths(estimate(it,th,1.6)),n:it.length,ok:it.filter(x=>x.ok).length};});
  run.res[cur.mod.id]={th,ae,sas:sasOf(ae,S.chron),n:cur.n,ok:cur.items.filter(x=>x.ok).length,comps,rev:cur.rev};
  run.mi++;
  if(run.mi<run.mods.length){
    screen='between';panel().innerHTML=`<div class="card"><h1>Well done!</h1><p class="sub">You have finished the <b>${esc(cur.mod.name)}</b> module. Take a short breath, then start the next one.</p><button class="big" id="b">Next module ${ARROW.replace('#6f9bcb','#fff')}</button></div>`;
    cur=null;$('#b').onclick=showIntro;$('#b').focus();
  }else{cur=null;saveRun();showReport('ae');}
}
function saveRun(){
  const rec={name:S.name,cls:S.cls,year:S.year,dob:S.dob,chron:S.chron,date:run.date,mods:{}};
  Object.keys(run.res).forEach(k=>{const r=run.res[k];rec.mods[k]={ae:r.ae,sas:r.sas,n:r.n,ok:r.ok,comps:r.comps};});
  const all=store('cpi_results')||[];all.push(rec);store('cpi_results',all.slice(-300));
}

/* ---------- reports ---------- */
const MCOL=[['maths','General Maths'],['mental','Mental Arithmetic'],['read','Reading'],['spell','Spelling'],['da','Developed Ability']];
const aeCell=(m,chron)=>m?`${ageStr(m.ae)} <span style="color:#667c9c">(${ageDiff(m.ae-chron)})</span>`:'–';
const sasCell=m=>{if(!m)return'<td>–</td>';const v=m.sas;return`<td class="${v>=106?'hi':v<=94?'lo':''}">${v} ${v>=106?'<span class="star">★</span>':v<=94?'<span class="warn">▲</span>':''}</td>`;};
function profileSVG(mods,chron){
  const rows=MCOL.filter(c=>mods[c[0]]),W=560,H=40+rows.length*38,l=140,mn=60,mx=170,X=m=>l+(m-mn)/(mx-mn)*(W-l-20);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
  for(let a=5;a<=14;a++){const x=X(a*12);s+=`<path d="M${x} 14V${H-22}" stroke="#e1e9f3"/><text x="${x}" y="${H-6}" font-size="11" text-anchor="middle" fill="#556b8b">${a}</text>`;}
  rows.forEach((c,i)=>{const y=22+i*38,m=mods[c[0]],x2=X(clamp(m.ae,mn,mx));s+=`<text x="${l-8}" y="${y+14}" font-size="13" text-anchor="end" fill="#161c2b">${c[1]}</text><rect x="${l}" y="${y}" width="${Math.max(2,x2-l)}" height="22" rx="4" fill="${m.ae>=chron?'#4f86c0':'#e0a064'}"/><text x="${x2+6}" y="${y+16}" font-size="12" fill="#161c2b">${ageStr(m.ae)}</text>`;});
  s+=`<path d="M${X(chron)} 8V${H-22}" stroke="#c8532b" stroke-width="2.5" stroke-dasharray="5 4"/><text x="${X(chron)}" y="9" font-size="11" text-anchor="middle" fill="#c8532b">age ${ageStr(chron)}</text></svg>`;return s;
}
function reviewHTML(res){
  let out='',cnt=0;
  MCOL.forEach(c=>{const r=res[c[0]];if(!r||!r.rev)return;r.rev.filter(x=>!x.ok).forEach(x=>{cnt++;const q=x.q;let h=`<div class="rv"><div class="cap" style="margin:0">${c[1]} · ${esc(q.title)}</div>`;
    if(q.type==='mc'){const f=i=>q.raw?q.opts[i]:esc(q.opts[i]);h+=`<div>${q.layout==='pv'?`<p class="q">Word: <b>${esc(q.word)}</b></p>`:q.matrix?`<div style="max-width:250px">${q.matrix.replace('class="mg"','class="mg" style="transform:scale(.7);transform-origin:left top;margin-bottom:-60px"')}</div>`:q.body}</div><div class="chips" style="margin-top:8px"><span class="b">Your answer</span> ${x.resp!=null?(q.raw?`<span style="display:inline-block;width:70px;vertical-align:middle">${f(x.resp)}</span>`:`<b>${f(x.resp)}</b>`):'–'} &nbsp; <span class="g">Correct</span> ${q.raw?`<span style="display:inline-block;width:70px;vertical-align:middle">${f(q.correct)}</span>`:`<b>${f(q.correct)}</b>`}</div>`;}
    else if(q.type==='type')h+=`${q.body||''}<div class="chips"><span class="b">You typed</span> ${esc(x.resp||'–')} &nbsp; <span class="g">Correct</span> <b>${esc(q.answers[0])}</b></div>`;
    else if(q.type==='sign')h+=`<p class="q">${q.left} ? ${q.right} = ${q.res}</p><div class="chips"><span class="b">Your sign</span> ${esc(x.resp)} &nbsp; <span class="g">Correct</span> <b>${q.correct}</b></div>`;
    else if(q.type==='cloze')h+=`<div class="chips"><span class="g">Correct words</span> ${q.gaps.map(g=>esc(g.right)).join(', ')}</div><div class="chips" style="margin-top:6px"><span class="b">Your words</span> ${x.resp.map(w=>esc(w)).join(', ')}</div>`;
    else h+=`<p class="cap">The dot pattern was not copied exactly.</p>`;
    if(q.expl)h+=`<p class="cap" style="font-style:italic">${esc(q.expl)}</p>`;out+=h+'</div>';});});
  return cnt?out:'<p class="cap">No misses — perfect run!</p>';

function showReport(tab){
  screen='report';tab=tab||'ae';const mods={};Object.keys(run.res).forEach(k=>{mods[k]=run.res[k];});
  const head=`<th>Name</th><th>Year Group</th><th>Class</th><th>Date Of Birth</th><th>Age At Assessment</th>`,info=`<td>${esc(S.name)}</td><td>Y${S.year}</td><td>${esc(S.cls)}</td><td>${esc(S.dob.split('-').reverse().join('/'))}</td><td>${ageStr(S.chron)}</td>`;

    const comp=[['maths',['Number','Algebra','Data Handling','Measure, Shape and Space'],['Numbers','Algebra','Data Handling','Measure, Shape And Space']],['read',['Word Recognition','Word Decoding','Comprehension'],['Word Recognition','Word Decoding','Comprehension']],['da',['Picture Vocabulary','Non-verbal Ability'],['Picture Vocabulary','Non-verbal Ability']]].filter(x=>mods[x[0]]);

   <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap"><button class="big" id="again">Practise again</button><button class="big alt" id="ch">Choose modules</button><button class="big alt" id="cs">Class summary</button></div></div>`;

}
